# Standalone web app (PWA) for self-hosting. Does not touch the Railway setup (mobile/Dockerfile).
# It only needs an API that is already reachable over HTTPS; it does not start the API or Postgres.
#
#   EXPO_PUBLIC_API_URL=https://api.example.com docker compose -f docker-compose.web.yml up -d --build
#
# Plain HTTP on port 80 by default. For automatic HTTPS set SITE_ADDRESS=app.example.com
# (DNS must point at this host and ports 80/443 must be open).
name: carreras-web

services:
  web:
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:?Set EXPO_PUBLIC_API_URL, e.g. https://api.example.com}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${WEB_PORT:-80}:80"
      - "443:443"
    volumes:
      - caddy-data:/data

volumes:
  caddy-data:
